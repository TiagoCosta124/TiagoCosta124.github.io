<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coleção de Cromos</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header>
      <h1>Coleção de Cromos</h1>
    </header>

    <main>
      <section id="colecao">
        <h2>A minha coleção</h2>

        <ul></ul>

        <h3>
          Total de cromos:
          <span class="total">0</span>
        </h3>
      </section>

      <section id="registo">
        <h2>Registar novo cromo</h2>

        <form>
          <label for="numero">Número do cromo:</label>

          <input id="numero" type="number" placeholder="Número" required />

          <input type="submit" value="Registar Cromo" />
        </form>
      </section>

      <section id="repetidos">
        <h2>Cromos repetidos</h2>

        <ul></ul>

        <h3>
          Total de repetidos:
          <span class="total">0</span>
        </h3>
      </section>
    </main>

    <footer>
      <p>2026, ULusófona</p>
    </footer>

    <script src="main.js"></script>
  </body>
</html>
