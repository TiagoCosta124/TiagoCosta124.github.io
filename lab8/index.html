<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Loja</title>

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header>
      <h1>Loja</h1>

      <nav>
        <ul>
          <li>
            <a href="#produtos">Produtos</a>
          </li>

          <li>
            <a href="#cesto">Cesto</a>
          </li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="produtos">
        <h2>Selecione os seus Produtos</h2>

        <div class="controlos">
          <label>
            Filtrar

            <select id="filtro">
              <option value="">Todas as categorias</option>
            </select>
          </label>

          <label>
            Ordenar

            <select id="ordenar">
              <option value="">Ordenar pelo preço</option>

              <option value="crescente">
                Preço Crescente
              </option>

              <option value="decrescente">
                Preço Decrescente
              </option>
              
            </select>
          </label>

          <label>
            Procurar

            <input
              id="pesquisa"
              type="text"
              placeholder="pesquise por produto"
            />
          </label>
        </div>

        

        <div class="lista-produtos"></div>
      </section>

      <section id="cesto">
        <h2>Produtos Selecionados</h2>

        <div class="lista-cesto"></div>

        <h2>
          Custo total:
          <span id="total">0.00</span> €
        </h2>

        <div class="checkout">
          <label>
            És estudante do DEISI?

            <select id="estudante">
              <option value="nao">Não</option>
              <option value="sim">Sim</option>
            </select>
          </label>

          <label>
            Cupão de desconto

            <input
              id="cupao"
              type="text"
              placeholder="Cupão"
            />
          </label>

          <button id="comprar" type="button">
            Comprar
          </button>

          <p>
            Referência para pagamento:
            <span id="referencia">-</span>
          </p>

          <p>
            Total final:
            <span id="total-compra">-</span> €
          </p>
        </div>
      </section>
      
    </main>

    <footer>
      <p>2026</p>
    </footer>

    <script src="script/main.js"></script>
  </body>
</html>
